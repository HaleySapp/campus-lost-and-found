<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item</title>
</head>
<body>

<h1>Report Lost Item</h1>

<form id="lostItemForm">

    <label for="itemName">Item Name:</label><br>
    <input type="text" id="itemName" name="itemName"><br><br>

    <label for="category">Category:</label><br>
    <input type="text" id="category" name="category"><br><br>

    <label for="date">Date Lost:</label><br>
    <input type="date" id="date" name="date"><br><br>

    <label for="location">Location Lost:</label><br>
    <input type="text" id="location" name="location"><br><br>

    <label for="color">Color:</label><br>
    <input type="text" id="color" name="color"><br><br>

    <label for="brand">Brand:</label><br>
    <input type="text" id="brand" name="brand"><br><br>

    <label for="description">Description / Distinguishing Characteristics:</label><br>
    <textarea id="description" name="description"></textarea><br><br>

    <label for="photoPath">Photo (Optional):</label><br>
    <input type="text" id="photoPath" name="photoPath"><br><br>

    <label for="contactInfo">Contact Information:</label><br>
    <input type="text" id="contactInfo" name="contactInfo"><br><br>

    <button type="submit">Submit Lost Item Report</button>

</form>

<p id="message"></p>

<script>
    const form = document.getElementById("lostItemForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const report = {
            itemName: document.getElementById("itemName").value,
            category: document.getElementById("category").value,
            date: document.getElementById("date").value,
            location: document.getElementById("location").value,
            color: document.getElementById("color").value,
            brand: document.getElementById("brand").value,
            description: document.getElementById("description").value,
            photoPath: document.getElementById("photoPath").value,
            contactInfo: document.getElementById("contactInfo").value
        };

        const response = await fetch("/api/reports/lost", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(report)
        });

        const result = await response.text();
        message.textContent = result;
    });
</script>
</body>
</html>
