<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Submissions</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        h1 {
            color: var(--navy);
            text-align: center;
            margin: 35px 0;
        }

        #submissions {
            max-width: 750px;
            margin: 30px auto;
            padding: 0 20px;
        }

        #submissions > div {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--teal);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #submissions h3 {
            color: var(--navy);
            margin-top: 0;
        }

        #submissions p {
            color: var(--text);
            line-height: 1.6;
        }

        #submissions strong {
            color: var(--teal);
        }

        #submissions hr {
            border: none;
            border-top: 1px solid #e5ecee;
            margin-top: 20px;
        }
    </style>

</head>
<body>
<nav class="site-nav" aria-label="Main navigation">
    <a href="/haley-found-item.html">Community Posts</a>
    <a href="/tyler-lost-item.html">Report Lost Item</a>
    <a href="/tyler-my-submissions.html">My Submissions</a>
    <a href="/sam-login.html">Login</a>
</nav>

<h1>My Submissions</h1>

<div id="submissions"></div>

<script>
    async function loadSubmissions() {
        const response = await fetch("/api/reports");
        const reports = await response.json();

        const container = document.getElementById("submissions");

        if (reports.length === 0) {
            container.textContent = "No submitted lost-item reports found.";
            return;
        }

        reports.forEach(report => {
            const reportDiv = document.createElement("div");

            reportDiv.innerHTML = `
                <h3>${report.itemName}</h3>
                <p><strong>Category:</strong> ${report.category}</p>
                <p><strong>Date Lost:</strong> ${report.date}</p>
                <p><strong>Location:</strong> ${report.location}</p>
                <p><strong>Description:</strong> ${report.description}</p>
                <p><strong>Status:</strong> ${report.status}</p>
                <hr>
            `;

            container.appendChild(reportDiv);
        });
    }

    loadSubmissions();
</script>

</body>
</html>
